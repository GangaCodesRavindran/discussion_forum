<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Landing Page</title>
    <link rel="stylesheet" type="text/css" href="{% static 'home/style.css' %}">
</head>
<body>
    <div class="top_background">
        <a type="image" href="{% url 'home' %}"  style="border-width:0px;">
            <img src="{% static 'home/Logotype_yellow.png' %}">
        </a>
        <span id="ucHeaderId_lblHeader" class="LabelBoldHeaderCss">EITC TECH FORUM</span>
    </div>

    {% if user.is_authenticated %}
    <div class="profile-container dropdown">
        <img src="{% static 'home/profileid.png' %}" alt="Profile Image" class="profile-image" width="70" height="70">
        <div class="dropdown-content" >
            <p>user: {{ user.username }}</p>
            <p>ID: {{ user.email }}</p>
            <hr>
            <p><a href="{% url 'logout' %}">Logout</a></p>
        </div>
    </div>
    {% endif %}


    <div class="container">
        <div class="image-with-text">
            <a href="{% url 'forum_redirect' %}" class="center-image">
                <img src="{% static 'home/disc_forum.png' %}" alt="Discussion Form" class="clickable-image">
            </a>
            <h3>Discussion Form</h3>
        </div>
        <div class="image-with-text">
            <a href="{% url 'videos_redirect' %}" class="center-image">
                <img src="{% static 'home/resourcelibrary.png' %}" alt="Resource Library" class="clickable-image">
            </a>
            <h3>Resource Library</h3>
        </div>
        <div class="image-with-text">
            <a href="{% url 'profiles' %}" class="center-image">
                <img src="{% static 'home/profiles.png' %}" alt="Profiles" class="clickable-image">
            </a>
            <h3>Profiles</h3>
        </div>
        <div class="image-with-text">
            <a href="{% url 'my_video' %}" class="center-image">
                <img src="{% static 'home/videos.png' %}" alt="Videos" class="clickable-image">
            </a>
            <h3>Videos</h3>
        </div>
    </div>


    <footer>
        <a href="{% url 'contact' %}">Contact</a> |
        <a href="{% url 'about' %}">About</a>
    </footer>

    <div class="footer-note">
        <span id="ucFooterId_footer">Web application developed and maintained by EITC.</span>
    </div>
</body>
</html>
