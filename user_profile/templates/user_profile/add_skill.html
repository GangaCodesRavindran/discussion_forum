<!-- user_profile\templates\user_profile\add_skill.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Skills</title>
    <link rel="stylesheet" href="{% static 'user_profile/styles.css' %}">
</head>
<body>
    <div class="top-background">
        <a type="image" href="{% url 'home' %}" style="border-width:0px;">
            <img src="{% static 'home/Logotype_yellow.png' %}">
        </a>
        <span id="ucHeaderId_lblHeader" class="LabelBoldHeaderCss header-text">
            EITC TECH FORUM
        </span>
    </div>
    {% if user.is_authenticated %}
    <div class="profile-container dropdown">
        <img src="{% static 'home/profileid.png' %}" alt="Profile Image" class="profile-image" width="70" height="70">
        <div class="dropdown-content">
            <p>user: {{ user.username }}</p>
            <p>ID: {{ user.email }}</p>
            <hr>
            <p><a href="{% url 'logout' %}">Logout</a></p>
        </div>
    </div>
    {% endif %}
    <h1>Add Skill for {{ user.first_name }} {{ user.last_name }}</h1>
    <form method="post">
        {% csrf_token %}
        <label for="skill">Skill:</label>
        <input type="text" id="skill" name="skill">
        <label for="level">Level:</label>
        <input type="text" id="level" name="level">
        <button type="submit">Add Skill</button>
    </form>
    <footer>
        <a href="/api/contact/">Contact</a> |
        <a href="/api/about/">About</a>
    </footer>

    <div class="footer-note">
        <span id="ucFooterId_footer">Web application developed and maintained by EITC.</span>
    </div>
</body>
</html>
