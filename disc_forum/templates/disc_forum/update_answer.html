<!-- disc_forum\templates\disc_forum\update_answer.html -->
<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Discussion Forum</title>
    <link rel="stylesheet" type="text/css" href="{% static 'home/style.css' %}">
</head>
<body>
    <div class="top_background">
        <a type="image" href="{% url 'home' %}" style="border-width:0px;">
            <img src="{% static 'home/Logotype_yellow.png' %}">
        </a>
        <span id="ucHeaderId_lblHeader" class="LabelBoldHeaderCss">EITC TECH FORUM</span>
    </div>

    {% if user.is_authenticated %}
    <div class="profile-container dropdown">
        <img src="{% static 'home/profileid.png' %}" alt="Profile Image" class="profile-image" width="70" height="70">
        <div class="dropdown-content">
            <p>user: {{ user.username }}</p>
            <p>ID: {{ user.email }}</p>
            <hr>
            <p><a href="{% url 'logout' %}">Logout</a></p>
        </div>
    </div>
    {% endif %}

    <hr>
    <h2>Update Answer</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="back-button">Save</button>
        <button type="button" class="back-button" onclick="window.location.href='{% url 'question_detail' answer.question.pk %}'">Cancel</button>
    </form>
    <footer>
        <a href="/api/contact/">Contact</a> |
        <a href="/api/about/">About</a>
    </footer>

    <div class="footer-note">
        <span id="ucFooterId_footer">Web application developed and maintained by EITC.</span>
    </div>
</body>
</html>
